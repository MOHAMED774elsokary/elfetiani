<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفتياني Coaching — غير متصل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: white;
      font-family: 'Inter', 'Cairo', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .offline-container {
      max-width: 420px;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #FF5500, #FF3300);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 0 40px rgba(255, 85, 0, 0.3);
    }
    .offline-icon svg {
      width: 40px;
      height: 40px;
      color: white;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .retry-btn {
      background: #FF5500;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 0.875rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 20px rgba(255, 85, 0, 0.2);
    }
    .retry-btn:hover {
      background: #FF6620;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: scale(0.97);
    }
    .brand {
      margin-top: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0.4;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF5500, #FF3300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
    }
    .brand-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالإنترنت غير متاح حالياً. تحقق من الاتصال وحاول مرة أخرى.</p>
    <button class="retry-btn" onclick="window.location.reload()">إعادة المحاولة</button>
    <div class="brand">
      <div class="brand-logo">F</div>
      <div class="brand-text">EL FETIANI COACHING</div>
    </div>
  </div>
</body>
</html>
