<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable icon: has safe zone padding for different mask shapes -->
  <rect width="512" height="512" fill="#050505"/>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  <!-- Slightly smaller F to stay within maskable safe zone (80% of icon area) -->
  <text x="256" y="276" font-family="Arial,Helvetica,sans-serif" font-size="240" font-weight="900" fill="#FF5500" text-anchor="middle" dominant-baseline="middle">F</text>
</svg>
